services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbc
      POSTGRES_PASSWORD: gbc_dev_password
      POSTGRES_DB: gbc_inbound
    ports:
      - "5432:5432"
    volumes:
      - gbc_pg_data:/var/lib/postgresql/data

volumes:
  gbc_pg_data:
